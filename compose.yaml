name: financial-analytics

x-core-profiles: &core-profiles [core, mail-catcher, local-llm]

x-backend-environment: &backend-environment
  APP_ENV: development
  APP_VERSION: 0.2.0
  DEBUG: "false"
  CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:4173","http://127.0.0.1:4173"]}'
  DATABASE_URL: postgresql+psycopg://financial_analytics:${POSTGRES_PASSWORD:-financial_analytics_dev}@postgres:5432/financial_analytics
  LOG_LEVEL: INFO
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:4173}
  BOOTSTRAP_MASTER_EMAIL: ${BOOTSTRAP_MASTER_EMAIL:-}
  TRUSTED_PROXY_IPS: "[]"
  SESSION_SECRET: ${SESSION_SECRET:-development-session-key-change-me-0001}
  CSRF_SECRET: ${CSRF_SECRET:-development-csrf-key-change-me-now-0001}
  EMAIL_TOKEN_SECRET: ${EMAIL_TOKEN_SECRET:-development-email-key-change-me-now-0001}
  SESSION_COOKIE_SECURE: "true"
  SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-no-reply@localhost}
  SMTP_SECURITY: ${SMTP_SECURITY:-plain}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
  LLM_PROVIDER: ${LLM_PROVIDER:-disabled}
  LLM_BASE_URL: ${LLM_BASE_URL:-http://vllm:8000/v1}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen3-4B-AWQ}
  LLM_ENDPOINT_SCOPE: ${LLM_ENDPOINT_SCOPE:-local}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
  LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
  LLM_RETRY_BACKOFF_SECONDS: ${LLM_RETRY_BACKOFF_SECONDS:-0.25}
  LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-800}
  LLM_SUPPORTS_JSON_SCHEMA: ${LLM_SUPPORTS_JSON_SCHEMA:-true}
  LLM_SUPPORTS_SYSTEM_MESSAGES: ${LLM_SUPPORTS_SYSTEM_MESSAGES:-true}
  LLM_SUPPORTS_NON_THINKING: ${LLM_SUPPORTS_NON_THINKING:-true}

x-backend: &backend
  image: financial-analytics-backend:0.2.0
  profiles: *core-profiles
  environment: *backend-environment
  init: true
  stop_grace_period: 35s
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    profiles: *core-profiles
    environment:
      POSTGRES_DB: financial_analytics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financial_analytics_dev}
      POSTGRES_USER: financial_analytics
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial_analytics -d financial_analytics"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - postgres_data:/var/lib/postgresql

  migrate:
    <<: *backend
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    command: ["python", "-m", "financial_analytics_api"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *backend
    command: ["python", "-m", "financial_analytics_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "financial_analytics_worker", "--healthcheck"]
      interval: 10s
      timeout: 15s
      retries: 6
      start_period: 10s

  web:
    image: financial-analytics-web:0.2.0
    profiles: *core-profiles
    build:
      context: .
      dockerfile: infra/docker/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4173/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    init: true
    ports:
      - "127.0.0.1:4173:4173"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  mailpit:
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    profiles: [mail-catcher]
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "1000"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - mailpit_data:/data

  vllm:
    profiles: [local-llm]
    image: vllm/vllm-openai:v0.11.0@sha256:014a95f21c9edf6abe0aea6b07353f96baa4ec291c427bb1176dc7c93a85845c
    command:
      - --model
      - Qwen/Qwen3-4B-AWQ
      - --revision
      - ${VLLM_MODEL_REVISION:-74d4bd2bd4bff9cafc9345221320bffb08b406a3}
      - --served-model-name
      - Qwen/Qwen3-4B-AWQ
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-2048}
      - --max-num-seqs
      - "1"
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.80}
    environment:
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_ENABLE_HF_TRANSFER: "0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 80
      start_period: 3m
    ipc: host
    ports:
      - "127.0.0.1:8001:8000"
    restart: unless-stopped
    volumes:
      - huggingface_cache:/root/.cache/huggingface

volumes:
  huggingface_cache:
  mailpit_data:
  postgres_data:
