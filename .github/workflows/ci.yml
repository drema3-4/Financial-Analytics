name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_DB: financial_analytics
          POSTGRES_PASSWORD: backend_test_password
          POSTGRES_USER: financial_analytics
        options: >-
          --health-cmd "pg_isready -U financial_analytics -d financial_analytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://financial_analytics:backend_test_password@localhost:5432/financial_analytics
      TEST_DATABASE_URL: postgresql+psycopg://financial_analytics:backend_test_password@localhost:5432/financial_analytics
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.12"
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - name: Install backend dependencies
        run: poetry install --no-interaction
      - name: Validate lock and package metadata
        run: poetry check --lock
      - name: Ruff lint
        run: poetry run ruff check .
      - name: Ruff formatting
        run: poetry run ruff format --check .
      - name: Mypy
        run: poetry run mypy
      - name: OpenAPI and generated client drift
        run: poetry run python scripts/generate_api_client.py --check
      - name: Pytest with coverage
        run: poetry run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24.21.0"
      - name: Install pinned pnpm
        run: npm install --global pnpm@12.12.1
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint
      - name: Formatting
        run: pnpm format:check
      - name: TypeScript
        run: pnpm typecheck
      - name: Vitest with coverage
        run: pnpm test
      - name: Production build
        run: pnpm build

  migration-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_DB: financial_analytics
          POSTGRES_PASSWORD: migration_test_password
          POSTGRES_USER: financial_analytics
        options: >-
          --health-cmd "pg_isready -U financial_analytics -d financial_analytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://financial_analytics:migration_test_password@localhost:5432/financial_analytics
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.12"
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - name: Install backend dependencies
        run: poetry install --no-interaction
      - name: Upgrade a clean database
        run: poetry run alembic upgrade head
      - name: Assert the baseline is current
        run: poetry run alembic current --check-heads
      - name: Assert metadata has no pending migration
        run: poetry run alembic check
      - name: Verify migration downgrade on an empty disposable database
        env:
          TEST_DATABASE_URL: postgresql+psycopg://financial_analytics:migration_test_password@localhost:5432/financial_analytics
        run: poetry run pytest tests/integration/test_migrations.py --no-cov

  compose-config:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: prod-db-password-for-compose-validation
      DATABASE_URL: postgresql+psycopg://financial_analytics:prod-db-password-for-compose-validation@postgres:5432/financial_analytics
      CORS_ORIGINS: '["https://finance.example.test"]'
      PUBLIC_BASE_URL: https://finance.example.test
      BOOTSTRAP_MASTER_EMAIL: master@example.test
      TRUSTED_PROXY_IPS: '["172.20.0.2"]'
      SESSION_SECRET: compose-validation-session-secret-2026-Alpha!
      CSRF_SECRET: compose-validation-csrf-secret-2026-Bravo!
      EMAIL_TOKEN_SECRET: compose-validation-email-secret-2026-Charlie!
      SMTP_HOST: smtp.example.test
      SMTP_FROM_ADDRESS: no-reply@example.test
    steps:
      - uses: actions/checkout@v5
      - name: Validate local Compose profiles
        run: |
          docker compose --profile core config --quiet
          docker compose --profile mail-catcher config --quiet
          docker compose --profile local-llm config --quiet
      - name: Validate production overlay
        run: docker compose -f compose.yaml -f compose.production.yaml --profile core config --quiet

  system-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_DB: financial_analytics_e2e
          POSTGRES_PASSWORD: e2e_test_password
          POSTGRES_USER: financial_analytics
        options: >-
          --health-cmd "pg_isready -U financial_analytics -d financial_analytics_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://financial_analytics:e2e_test_password@127.0.0.1:5432/financial_analytics_e2e
      SESSION_SECRET: e2e-session-secret-is-longer-than-32-bytes
      CSRF_SECRET: e2e-csrf-secret-is-longer-than-32-bytes-now
      EMAIL_TOKEN_SECRET: e2e-email-secret-is-longer-than-32-bytes
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24.21.0"
      - name: Install pinned package managers
        run: |
          pipx install poetry==2.5.1
          npm install --global pnpm@12.12.1
      - name: Install application and browser dependencies
        run: |
          poetry install --no-interaction
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps --no-shell chromium
      - name: Upgrade isolated E2E database
        run: poetry run alembic upgrade head
      - name: Seven real system scenarios
        run: pnpm test:e2e:system
      - name: Upload diagnostics only after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-system-failure
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  backup-restore-drill:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_DB: financial_analytics_backup_source
          POSTGRES_PASSWORD: restore_test_password
          POSTGRES_USER: financial_analytics
        options: >-
          --health-cmd "pg_isready -U financial_analytics -d financial_analytics_backup_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://financial_analytics:restore_test_password@127.0.0.1:5432/financial_analytics_backup_source
      SOURCE_DATABASE_URL: postgresql+psycopg://financial_analytics:restore_test_password@127.0.0.1:5432/financial_analytics_backup_source
      RESTORE_DATABASE_URL: postgresql+psycopg://financial_analytics:restore_test_password@127.0.0.1:5432/financial_analytics_restore
      SESSION_SECRET: restore-session-secret-is-longer-than-32-bytes
      CSRF_SECRET: restore-csrf-secret-is-longer-than-32-bytes-now
      EMAIL_TOKEN_SECRET: restore-email-secret-is-longer-than-32-bytes
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.12"
      - name: Install backend
        run: |
          pipx install poetry==2.5.1
          poetry install --no-interaction
      - name: Seed a realistic ledger through the API
        run: |
          poetry run alembic upgrade head
          poetry run python scripts/backup_restore_drill.py seed
          poetry run python scripts/create_restore_database.py
      - name: Back up with PostgreSQL 18 client
        run: |
          mkdir -p tmp
          docker run --rm --network host -v "$PWD:/workspace" -w /workspace \
            -e DATABASE_URL=postgresql://financial_analytics:restore_test_password@127.0.0.1:5432/financial_analytics_backup_source \
            postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c \
            bash scripts/postgres_backup.sh tmp/restore-drill.dump
      - name: Restore into a separate empty database
        run: |
          docker run --rm --network host -v "$PWD:/workspace" -w /workspace \
            -e SOURCE_DATABASE_URL=postgresql://financial_analytics:restore_test_password@127.0.0.1:5432/financial_analytics_backup_source \
            -e RESTORE_DATABASE_URL=postgresql://financial_analytics:restore_test_password@127.0.0.1:5432/financial_analytics_restore \
            postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c \
            bash scripts/postgres_restore.sh tmp/restore-drill.dump
      - name: Prove restored rows, ledger invariants, and migration compatibility
        run: |
          poetry run python scripts/backup_restore_drill.py verify
          DATABASE_URL="$RESTORE_DATABASE_URL" poetry run alembic upgrade head
          DATABASE_URL="$RESTORE_DATABASE_URL" poetry run alembic current --check-heads
          DATABASE_URL="$RESTORE_DATABASE_URL" poetry run alembic check

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Vulnerability, secret, and configuration gate
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          version: v0.76.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24.21.0"
      - name: Materialize dependency metadata for license and SBOM reports
        run: |
          pipx install poetry==2.5.1
          npm install --global pnpm@12.12.1
          poetry config virtualenvs.in-project true
          poetry install --no-interaction
          pnpm install --frozen-lockfile
      - name: Generate full license report
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          scan-type: fs
          scan-ref: .
          scanners: license
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"
          format: json
          output: license-report.json
          skip-setup-trivy: true
          version: v0.76.0
      - name: Fail on forbidden or restricted licenses
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          scan-type: fs
          scan-ref: .
          scanners: license
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          skip-setup-trivy: true
          version: v0.76.0
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: financial-analytics-sbom.cdx.json
      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: financial-analytics-license-report
          path: license-report.json
          retention-days: 30

  container-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build runtime images
        run: |
          docker build -f infra/docker/backend/Dockerfile -t financial-analytics-backend:ci .
          docker build -f infra/docker/web/Dockerfile -t financial-analytics-web:ci .
      - name: Scan backend runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: financial-analytics-backend:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          version: v0.76.0
      - name: Scan web runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: financial-analytics-web:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          skip-setup-trivy: true
          version: v0.76.0
