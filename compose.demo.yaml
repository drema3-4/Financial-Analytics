# Always use with: -p financial-analytics-demo --env-file .env.demo
services:
  api:
    image: financial-analytics-backend:demo
    environment: &demo-environment
      CORS_ORIGINS: '["http://127.0.0.1:4174","http://localhost:4174"]'
      PUBLIC_BASE_URL: http://127.0.0.1:4174
    ports: !override
      - "127.0.0.1:8002:8000"

  migrate:
    image: financial-analytics-backend:demo
    environment: *demo-environment

  worker:
    image: financial-analytics-backend:demo
    environment: *demo-environment

  web:
    image: financial-analytics-web:demo
    build:
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8002
    ports: !override
      - "127.0.0.1:4174:4173"

  vllm:
    ports: !override
      - "127.0.0.1:8003:8000"

volumes:
  huggingface_cache:
    external: true
    name: financial-analytics_huggingface_cache
